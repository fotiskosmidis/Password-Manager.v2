name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev nlohmann-json3-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build C++ backend
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --parallel
      - name: Stage native library
        run: mkdir -p src-tauri/resources && cp build/libpassword_manager_backend.so src-tauri/resources/
      - name: Build and release Linux app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: vcpkg install openssl:x64-windows-static nlohmann-json:x64-windows-static
      - run: npm ci
      - name: Build C++ backend
        shell: pwsh
        run: |
          $toolchain = "C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
          if (!(Test-Path $toolchain)) {
            Write-Error "vcpkg toolchain file was not found at $toolchain"
            exit 1
          }
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DOPENSSL_USE_STATIC_LIBS=TRUE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel
      - name: Stage native library
        shell: pwsh
        run: New-Item -ItemType Directory -Force src-tauri/resources; Copy-Item build/Release/password_manager_backend.dll src-tauri/resources/ -Force
      - name: Build and release Windows app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}